# This file was created automatically with `myst init --gh-pages` 🪄 💚

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Install the plugins
        run: npm install
      - name: Build HTML Assets
        run: myst build --html
      - name: Inject Siteimprove analytics
        run: node inject-siteimprove.js
      # - name: Find duplicated base paths in build output
      #   run: |
      #     echo "Searching for duplicated paths..."
      #     grep -R --line-number "spring-2026/spring-2026" ./_build/html || true
      #     grep -R --line-number "/spring-2026/spring-2026" ./_build/html || true
      # - name: Fix duplicated base path in built assets
      #   run: |
      #     find ./_build/html -type f \( -name "*.html" -o -name "*.xml" -o -name "*.json" -o -name "*.js" \) -print0 \
      #       | xargs -0 sed -i \
      #         -e 's/spring-2026\/spring-2026/spring-2026/g'
      # - name: Fix PDF URLs in JSON + HTML (exclude root index.html)
      #   run: |
      #     find ./_build/html -type f \( \
      #         -name "*.json" \
      #         -o \( -name "*.html" -a ! -path "./_build/html/index.html" \) \
      #       \) -print0 \
      #       | xargs -0 sed -i -E 's|/spring-2026(/build/[^"[:space:]]+\.pdf)|\1|g'
      # - name: Verify rewrite worked
      #   run: |
      #     echo "After sed:"
      #     grep -R --line-number "spring-2026/spring-2026" ./_build/html || echo "no duplicates found"
      - name: Copy standalone HTML apps into build output
        run: |
          mkdir -p ./_build/html/lectures
          cp ./public/lectures/07_finger-tap.html ./_build/html/lectures/07_finger-tap.html
          # sanity check
          test -f ./_build/html/lectures/07_finger-tap.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
